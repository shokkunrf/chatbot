services:
  chatbot:
    build: .
    environment:
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      LOG_LEVEL: ${LOG_LEVEL}
      MAX_HISTORY: ${MAX_HISTORY}
      RESPONSE_TIMEOUT: ${RESPONSE_TIMEOUT}
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
